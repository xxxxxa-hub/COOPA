    Code:
    ```py
    import json
    import re
    from ortools.sat.python import cp_model

    # Read current problem data
    raw = see_file(filename="current_problem_data.txt")
    cleaned = "\n".join(re.sub(r"^\s*\d+:\s*", "", line) for line in raw.splitlines())
    data = json.loads(cleaned)

    # Build model for current problem
    model = cp_model.CpModel()
    num_workers = 5
    num_tasks = 6
    costs = data["costs"]  # 5x6 matrix

    # Create variables
    x = {}
    for w in range(num_workers):
        for t in range(num_tasks):
            x[(w, t)] = model.NewBoolVar(f'x[{w},{t}]')

    # Each task assigned to exactly one worker
    for t in range(num_tasks):
        model.Add(sum(x[(w, t)] for w in range(num_workers)) == 1)

    # Add precedence constraints (task 2 must be done before task 5)
    for w in range(num_workers):
        model.Add(x[(w, 2)] >= x[(w, 5)])

    # Minimize cost
    model.Minimize(sum(costs[w][t] * x[(w, t)] for w in range(num_workers) for t in range(num_tasks)))

    # Solve
    solver = cp_model.CpSolver()
    status = solver.Solve(model)

    print(f"Status: {solver.StatusName(status)}")
    print(f"Objective: {solver.ObjectiveValue()}")
    for w in range(num_workers):
        for t in range(num_tasks):
            if solver.Value(x[(w, t)]) == 1:
                print(f"Worker {w} -> Task {t}")
    ```<end_code>


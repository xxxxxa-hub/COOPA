    === SOLUTION.PY ===
    import json
    from ortools.sat.python import cp_model

    def solve_assignment():
        with open("parameters.json", "r") as f:
            data = json.load(f)

        model = cp_model.CpModel()
        num_workers = data["num_workers"]
        num_tasks = data["num_tasks"]
        costs = data["costs"]

        # Create variables
        x = {}
        for w in range(num_workers):
            for t in range(num_tasks):
                x[(w, t)] = model.NewBoolVar(f'x[{w},{t}]')

        # Each worker is assigned to at most one task
        for w in range(num_workers):
            model.Add(sum(x[(w, t)] for t in range(num_tasks)) <= 1)

        # Each task is assigned to exactly one worker
        for t in range(num_tasks):
            model.Add(sum(x[(w, t)] for w in range(num_workers)) == 1)

        # Objective: minimize cost
        model.Minimize(sum(costs[w][t] * x[(w, t)] for w in range(num_workers) for t in range(num_tasks)))

        solver = cp_model.CpSolver()
        status = solver.Solve(model)
        return {"status": status, "objective": solver.ObjectiveValue()}


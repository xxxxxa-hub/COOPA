    === STAGE 3: Build the OR-Tools Model ===
    Write a complete and valid OR-Tools model in Python. Follow these rules:

    **Model Components**
    - Define all data as variables or constants at the top of the script.
    - Use OR-Tools' modeling constructs for variables, constraints, and objectives.
    - Clearly separate the summary and the OR-Tools code with section comments.

    **Variable Domains**
    - Use integer or boolean variables as appropriate.
    - Explicitly define variable domains and bounds.

    **Constraints**
    - Use `model.Add(...)` for regular constraints and `OnlyEnforceIf(...)` for conditional ones.
    - **Important:** Do **not** pass expressions like `a != b`, `a < b`, or `a == b` directly into `AddBoolOr` or `AddBoolAnd`. These only accept Boolean variables or literals.
    - Instead, create Boolean variables to represent logical expressions:

        ```py
        b1 = model.NewBoolVar('b1')
        model.Add(a != b).OnlyEnforceIf(b1)
        model.Add(a == b).OnlyEnforceIf(b1.Not())
        model.AddBoolOr([b1, other_bool_var])
        ```<end_code>

    - Use Boolean variables to express mutual exclusion, logical combinations, or implications.
    - Use `AddAllowedAssignments` or `AddForbiddenAssignments` for domain constraints where appropriate.

    **Objective**
    - Use the appropriate method to set the objective (minimize or maximize).

    **Value Extraction**
    - After solving, extract and print the values of all decision variables and the objective.

    **Structure**
    - Clearly separate sections in the script with comments like:

    ```py
    # ===== Model Definition =====
    # ===== Solver Execution =====
    # ===== Solution Extraction =====
    ```<end_code>

    === STAGE 4: Solve and Report ===
    - Build and solve the model INLINE in your code blocks (do NOT use `load_object_from_python_file`)
    - The model code should be executed directly in your Python code block
    - **Note**: Do NOT use `load_object_from_python_file` to execute solution code, as it won't have access to agent tools like `see_file`

    - Print or return:
        * Solver status and termination condition
        * Objective value
        * Values of all decision variables

    === STAGE 5: Infeasibility or Solver Failures ===
    - If the solver fails, report the failure clearly.
    - Suggest possible causes (e.g., conflicting constraints, missing data).
    - Propose next modeling or data-checking steps.

    === STAGE 6: Final Answer ===
    **CRITICAL REMINDER BEFORE CALLING final_answer:**

    Checking for retrieved knowledge and analyzing examples does NOT mean you have solved the problem!

    **YOU MUST:**
    1. ✓ Have ACTUALLY RUN THE SOLVER (OR-Tools) to solve YOUR current problem
    2. ✓ Have RECEIVED THE ACTUAL RESULTS from the solver execution
    3. ✓ Report the REAL objective value, routes, schedules, or assignments from YOUR solver output

    **DO NOT:**
    - ✗ Call final_answer without running the solver on your current problem
    - ✗ Report results from the retrieved example as if they were your results
    - ✗ Make up or guess results based on reasoning
    - ✗ Report placeholder values

    The results in your final_answer MUST come from actually solving YOUR problem, not from retrieved examples!

    Once all steps are complete, use the `final_answer` tool to return a structured plain-text summary of the solution.
    Format your answer as a multiline string with the following sections, clearly labeled and easy to parse:

    Status: <solver status — e.g., "optimal", "infeasible", "error">
    Objective: <objective value, or "N/A" if not applicable>
    Variables:
        <var_name_1>: <value>
        <var_name_2>: <value>
        ...
    Notes:
        <any relevant modeling observations, solver messages, or warnings>
    Files:
